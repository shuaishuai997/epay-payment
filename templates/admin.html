<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevPay 管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#050818;
    min-height:100vh;
    color:#fff;
    position:relative;
}
/* 动态粒子背景 */
#particles{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:1;
}

/* 霓虹故障动画 */
@keyframes glitch{
    0%{text-shadow:0.05em 0 0 rgba(0,210,255,0.7),-0.05em -0.025em 0 rgba(255,0,200,0.7)}
    50%{text-shadow:-0.05em -0.025em 0 rgba(0,210,255,0.7),0.025em 0.025em 0 rgba(255,0,200,0.7)}
    100%{text-shadow:0.025em 0.05em 0 rgba(0,210,255,0.7),0.05em 0 0 rgba(255,0,200,0.7)}
}

/* 扫描线 */
@keyframes scan{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(200%)}
}

/* 顶部导航 */
.header{
    background:rgba(10,15,35,0.9);
    padding:0 24px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(0,210,255,0.2);
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(10px);
}
.header .logo{
    font-size:18px;
    font-weight:700;
    color:#00d2ff;
    animation:glitch 3s infinite alternate-reverse;
}
.header .right{
    display:flex;
    align-items:center;
    gap:16px;
}
.header .right button{
    padding:6px 16px;
    background:linear-gradient(90deg,#00d2ff,#a0f);
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    transition:0.2s;
}
.header .right button:hover{
    opacity:0.9;
    box-shadow:0 0 10px rgba(0,210,255,0.4);
}

/* 主面板 */
.dashboard{
    padding:24px;
    max-width:1200px;
    max-height:calc(100vh - 56px);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    margin:0 auto;
    position:relative;
    z-index:10;
}

/* 数据卡片 */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:24px;
}
.stat-card{
    background:rgba(10,15,35,0.8);
    padding:20px;
    border-radius:12px;
    border:1px solid rgba(0,210,255,0.2);
    position:relative;
    overflow:hidden;
}
.stat-card::after{
    content:'';
    position:absolute;
    top:0;left:0;
    width:100%;height:3px;
    background:linear-gradient(90deg,#00d2ff,#ff00c8);
    animation:scan 3s linear infinite;
}
.stat-card .label{
    font-size:13px;
    color:#aaa;
    margin-bottom:8px;
}
.stat-card .value{
    font-size:28px;
    font-weight:700;
    color:#fff;
    text-shadow:0 0 10px rgba(0,210,255,0.3);
}
.stat-card.waiting .value{color:#ffcc00}
.stat-card.paid .value{color:#00e474}
.stat-card.total .value{color:#00d2ff}

/* 筛选栏 */
.filter-bar{
    background:rgba(10,15,35,0.8);
    padding:16px;
    border-radius:12px;
    margin-bottom:16px;
    display:flex;
    gap:12px;
    align-items:center;
    border:1px solid rgba(0,210,255,0.2);
    flex-wrap:wrap;
    backdrop-filter:blur(4px);
}
.filter-bar select,
.filter-bar input{
    padding:8px 12px;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(0,210,255,0.3);
    border-radius:6px;
    font-size:14px;
    color:#fff;
    outline:none;
}
.filter-bar button{
    padding:8px 16px;
    background:linear-gradient(90deg,#00d2ff,#a0f);
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    transition:0.2s;
}
.filter-bar button:hover{
    box-shadow:0 0 8px rgba(0,210,255,0.4);
}
.filter-bar .spacer{flex:1}

/* 表格 */
.table-wrap{
    background:rgba(10,15,35,0.8);
    border-radius:12px;
    border:1px solid rgba(0,210,255,0.2);
    overflow:hidden;
    backdrop-filter:blur(4px);
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    position:relative;
}
.table-header{
    flex-shrink:0;
    background:rgba(0,0,0,0.3);
    border-bottom:1px solid rgba(0,210,255,0.2);
    overflow-x:auto;
}
.table-body{
    flex:1;
    overflow:auto;
}
table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
    min-width:100%;
}
th{
    background:rgba(0,0,0,0.3);
    padding:12px 16px;
    text-align:left;
    font-weight:500;
    color:#00d2ff;
    white-space:nowrap;
    position:sticky;
    top:0;
}
td{
    padding:10px 16px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    color:#eee;
    white-space:nowrap;
}
tr:last-child td{border-bottom:none}
tr:hover{background:rgba(0,210,255,0.05)}
#orderTable{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* 状态标签 */
.badge{
    padding:2px 8px;
    border-radius:10px;
    font-size:12px;
    white-space:nowrap;
}
.badge-waiting{background:rgba(255,204,0,0.1);color:#ffcc00}
.badge-paid{background:rgba(0,228,116,0.1);color:#00e474}
.badge-closed{background:rgba(150,150,150,0.1);color:#aaa}

/* 按钮 */
.btn{
    padding:5px 12px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:13px;
    margin-right:4px;
    transition:0.2s;
}
.btn-confirm{
    background:#00e474;
    color:#000;
    font-weight:500;
}
.btn-confirm:hover{box-shadow:0 0 8px #00e474}
.btn:disabled{
    background:#333;
    color:#666;
    cursor:not-allowed;
}

/* 提示 */
.msg{
    position:fixed;
    bottom:24px;
    right:24px;
    padding:12px 24px;
    background:#111;
    color:#fff;
    border-radius:8px;
    font-size:14px;
    z-index:1000;
    border:1px solid rgba(0,210,255,0.3);
}
.msg.success{background:rgba(0,228,116,0.1);color:#00e474}
.msg.error{background:rgba(255,68,119,0.1);color:#ff4477}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#888}

/* 分页 */
#pagination{
    padding:12px 16px;
    display:flex;
    justify-content:center;
    gap:8px;
    background:rgba(10,15,35,0.9);
    border-top:1px solid rgba(0,210,255,0.2);
    flex-shrink:0;
}
#pagination button{
    padding:6px 12px;
    background:rgba(0,0,0,0.3);
    color:#fff;
    border:1px solid rgba(0,210,255,0.3);
    border-radius:6px;
    cursor:pointer;
}
#pagination button:hover{
    background:#00d2ff;
    color:#000;
}

/* 弹窗 */
#cfgModal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:9999;
    background:rgba(0,0,0,0.7);
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(4px);
}
#cfgModal > div{
    background:rgba(10,15,35,0.95);
    border-radius:16px;
    width:520px;
    max-width:95vw;
    max-height:90vh;
    overflow-y:auto;
    padding:28px;
    border:1px solid rgba(0,210,255,0.3);
    box-shadow:0 0 40px rgba(0,210,255,0.2);
}
#cfgModal h2{color:#00d2ff}
#cfgModal input{
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(0,210,255,0.3);
    color:#fff;
    width:100%;
    padding:10px 14px;
    border-radius:8px;
    font-size:14px;
    outline:none;
    transition:border-color 0.2s;
}
#cfgModal input:focus{
    border-color:#00d2ff;
    box-shadow:0 0 0 3px rgba(0,210,255,0.1);
}
#cfgModal button{
    background:linear-gradient(90deg,#00d2ff,#a0f);
    color:#fff;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
    transition:opacity 0.2s, box-shadow 0.2s;
}
#cfgModal button:hover{
    opacity:0.9;
    box-shadow:0 0 10px rgba(0,210,255,0.4);
}
#cfgModal button:disabled{
    background:#333;
    cursor:not-allowed;
    opacity:0.5;
}
</style>
</head>

<body>
<!-- 动态粒子背景 -->
<canvas id="particles"></canvas>

<div class="header">
  <div class="logo">DevPay 管理后台</div>
  <div class="right">
    <span id="userLabel">👤 已登录</span>
    <button onclick="showConfig()">⚙️ 收款配置</button>
    <button onclick="doLogout()">退出登录</button>
  </div>
</div>

<div class="dashboard" id="mainContent">
  <div class="stats">
    <div class="stat-card total">
      <div class="label">总订单</div>
      <div class="value" id="statTotal">-</div>
    </div>
    <div class="stat-card paid">
      <div class="label">已支付</div>
      <div class="value" id="statPaid">-</div>
    </div>
    <div class="stat-card waiting">
      <div class="label">待处理</div>
      <div class="value" id="statWaiting">-</div>
    </div>
    <div class="stat-card">
      <div class="label">总收入</div>
      <div class="value" id="statIncome">¥-</div>
    </div>
  </div>

  <div class="filter-bar">
    <select id="filterStatus" onchange="loadOrders(1)">
      <option value="">全部状态</option>
      <option value="0">待处理</option>
      <option value="1">已支付</option>
      <option value="2">已关闭</option>
    </select>
    <select id="filterType" onchange="loadOrders(1)">
      <option value="">全部类型</option>
      <option value="wxpay">💚 微信</option>
      <option value="alipay">💙 支付宝</option>
      <option value="qqpay">🐧 QQ钱包</option>
    </select>
    <input type="text" id="filterTradeNo" placeholder="订单号" style="width:180px" onkeydown="if(event.key==='Enter')loadOrders(1)">
    <button onclick="loadOrders(1)">🔍 搜索</button>
    <button onclick="loadOrders(1)">🔄 刷新</button>
    <div class="spacer"></div>
  </div>

  <div class="table-wrap">
    <div class="loading" id="loadingText">加载中...</div>
    <div id="orderTable" style="display:none">
      <div class="table-header">
        <table>
          <thead>
            <tr>
              <th>订单号</th>
              <th>商户</th>
              <th>外部订单</th>
              <th>支付方式</th>
              <th>商品名称</th>
              <th>金额</th>
              <th>状态</th>
              <th>创建时间</th>
              <th>支付时间</th>
              <th>操作</th>
            </tr>
          </thead>
        </table>
      </div>
      <div class="table-body">
        <table>
          <tbody id="orderBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="pagination"></div>
</div>

<div id="toast" class="msg hidden"></div>

<!-- 配置弹窗 -->
<div id="cfgModal">
  <div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h2>⚙️ 系统配置</h2>
      <button onclick="closeConfigModal()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999">×</button>
    </div>
    <p style="color:#aaa;font-size:13px;margin-bottom:20px">配置网站基础信息和支付方式收款码</p>

    <div style="display:flex;gap:20px">
      <!-- 左侧：网站配置 -->
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;color:#00d2ff;margin-bottom:14px">🌐 网站配置</div>
        <div style="margin-bottom:14px">
          <label style="display:block;margin-bottom:6px;font-size:13px;color:#aaa">🏠 网站名称</label>
          <input type="text" id="cfg-site-name" placeholder="DevPay">
        </div>
        <div style="margin-bottom:14px">
          <label style="display:block;margin-bottom:6px;font-size:13px;color:#aaa">🔗 网站URL</label>
          <input type="text" id="cfg-site-url" placeholder="http://localhost:8080">
        </div>
      </div>

      <!-- 右侧：支付配置 -->
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;color:#00d2ff;margin-bottom:14px">💳 支付配置</div>
        <div style="margin-bottom:14px">
          <label style="display:block;margin-bottom:6px;font-size:13px;color:#aaa">💚 微信收款码链接</label>
          <input type="text" id="cfg-wxpay" placeholder="https://qr.weixin.qq.com/xxx">
        </div>
        <div style="margin-bottom:14px">
          <label style="display:block;margin-bottom:6px;font-size:13px;color:#aaa">💙 支付宝收款码链接</label>
          <input type="text" id="cfg-alipay" placeholder="https://qr.alipay.com/xxx">
        </div>
      </div>
    </div>

    <div style="background:rgba(0,0,0,0.2);border:1px solid rgba(0,210,255,0.2);border-radius:10px;padding:14px 16px;margin-top:20px">
      <div style="font-size:14px;font-weight:600;color:#00d2ff;margin-bottom:10px">🔑 商户凭证</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:12px;color:#aaa">商户ID：</span>
        <span id="mch-pid" style="font-size:13px;color:#fff">—</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:12px;color:#aaa">密钥：</span>
        <input type="text" id="mch-key" placeholder="your_default_key" style="flex:1;padding:6px 10px;border-radius:6px;font-size:13px">
      </div>
      <button onclick="saveMerchantKey()" id="btn-save-key" style="margin-top:6px">保存密钥</button>
      <span id="mch-msg" style="margin-left:10px;font-size:12px"></span>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.05)">
      <button onclick="saveConfig()" style="flex:1">💾 保存配置</button>
      <button onclick="closeConfigModal()">取消</button>
    </div>
    <div id="config-msg" style="margin-top:10px;font-size:13px;text-align:center"></div>
  </div>
</div>

<script>
// ===================== 动态赛博粒子背景 =====================
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

let particles = [];
const particleCount = 80;

class Particle{
    constructor(){
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.color = Math.random() > 0.5 ? '#00d2ff' : '#a0f';
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x < 0 || this.x > w) this.speedX *= -1;
        if(this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw(){
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init(){
    particles = [];
    for(let i=0;i<particleCount;i++) particles.push(new Particle());
}
init();

function connect(){
    for(let a=0;a<particles.length;a++){
        for(let b=a;b<particles.length;b++){
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 120){
                ctx.strokeStyle = `rgba(0,210,255,${1 - dist/120})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p => {p.update();p.draw();});
    connect();
    requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', ()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    init();
});

// ===================== 核心业务逻辑 =====================
let page = 1;
let totalPages = 1;

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'msg ' + (type || '');
  setTimeout(() => t.classList.add('hidden'), 3000);
}

function checkAuth() {
  fetch('/admin/stats')
    .then(r => r.json())
    .then(d => {
      if(d.code === 401) { location.href = '/admin/login'; return; }
      loadStats();
      loadOrders(1);
    }).catch(() => location.href = '/admin/login');
}

function loadStats() {
  fetch('/admin/stats')
    .then(r => r.json())
    .then(d => {
      if(d.code !== 200) return;
      document.getElementById('statTotal').textContent = d.data.total || 0;
      document.getElementById('statPaid').textContent = d.data.paid || 0;
      document.getElementById('statWaiting').textContent = d.data.waiting || 0;
      document.getElementById('statIncome').textContent = '¥' + (d.data.income || '0.00');
    });
}

function loadOrders(p) {
  page = p || page;
  document.getElementById('loadingText').style.display = 'block';
  document.getElementById('orderTable').style.display = 'none';

  const status = document.getElementById('filterStatus').value;
  const type = document.getElementById('filterType').value;
  const tradeNo = document.getElementById('filterTradeNo').value;
  let url = `/admin/orders?page=${page}`;
  if(status) url += `&status=${status}`;
  if(type) url += `&type=${type}`;
  if(tradeNo) url += `&trade_no=${encodeURIComponent(tradeNo)}`;

  fetch(url)
    .then(r => r.json())
    .then(d => {
      if(d.code === 401) { location.href = '/admin/login'; return; }
      document.getElementById('loadingText').style.display = 'none';
      document.getElementById('orderTable').style.display = 'table';
      renderTable(d.data.orders || []);
      renderPagination(d.data.total || 0, d.data.pages || 1);
    }).catch(() => {
      document.getElementById('loadingText').textContent = '加载失败';
    });
}

function renderTable(orders) {
  const tbody = document.getElementById('orderBody');
  if(!orders.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#888;padding:40px">暂无数据</td></tr>';
    return;
  }

  const typeName = {wxpay:'💚微信',alipay:'💙支付宝',qqpay:'🐧QQ'};
  const statusName = {0:'待处理',1:'已支付',2:'已关闭'};
  const statusClass = {0:'badge-waiting',1:'badge-paid',2:'badge-closed'};
  
  let html = '';
  orders.forEach(o => {
    const canConfirm = o.status === 0;
    html += `
    <tr>
      <td style="font-size:12px;color:#888">${o.trade_no}</td>
      <td>${o.pid}</td>
      <td style="font-size:12px">${o.out_trade_no}</td>
      <td>${typeName[o.type] || o.type}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.name || '—'}</td>
      <td style="font-weight:600;color:#ff4477">¥${o.money}</td>
      <td><span class="badge ${statusClass[o.status]}">${statusName[o.status]}</span></td>
      <td style="font-size:12px">${o.create_time || ''}</td>
      <td style="font-size:12px">${o.pay_time || '—'}</td>
      <td>
        <button class="btn btn-confirm" ${canConfirm ? '' : 'disabled'} onclick="confirmOrder('${o.trade_no}',this)">
          ${canConfirm ? '确认收款' : '—'}
        </button>
      </td>
    </tr>`;
  });
  tbody.innerHTML = html;
}

function renderPagination(total, pages) {
  totalPages = pages;
  const pg = document.getElementById('pagination');
  if(pages <= 1) { pg.innerHTML = ''; return; }
  let html = '';
  for(let i=1;i<=pages;i++){
    html += `<button onclick="loadOrders(${i})" ${i===page ? 'style="background:#00d2ff;color:#000"' : ''}>${i}</button>`;
  }
  pg.innerHTML = html;
}

function confirmOrder(tradeNo, btn) {
  if(!confirm('确认已收到该订单款项？')) return;
  btn.disabled = true; btn.textContent = '...';
  const fd = new FormData();
  fd.append('trade_no', tradeNo);
  fetch('/admin/order/confirm', {method:'POST', body:fd})
    .then(r => r.json())
    .then(d => {
      if(d.code === 200) {
        showToast('✅ 确认成功', 'success');
        loadStats(); loadOrders(page);
      } else {
        showToast('❌ ' + d.msg, 'error');
        btn.disabled = false; btn.textContent = '确认收款';
      }
    }).catch(() => {
      showToast('❌ 网络错误', 'error');
      btn.disabled = false; btn.textContent = '确认收款';
    });
}

function doLogout() {
  fetch('/admin/logout').then(() => location.href = '/admin/login');
}

// 配置弹窗
function loadConfig() {
  fetch('/admin/config')
    .then(r => r.json())
    .then(d => {
      if(d.code === 200 && d.data) {
        document.getElementById('cfg-site-name').value = d.data.site_name || '';
        document.getElementById('cfg-site-url').value = d.data.site_url || '';
        document.getElementById('cfg-wxpay').value = d.data.wxpay_qrcode || '';
        document.getElementById('cfg-alipay').value = d.data.alipay_qrcode || '';
      }
    });
}
function saveConfig() {
  const siteName = document.getElementById('cfg-site-name').value.trim();
  const siteURL = document.getElementById('cfg-site-url').value.trim();
  const wxpay = document.getElementById('cfg-wxpay').value.trim();
  const alipay = document.getElementById('cfg-alipay').value.trim();
  const msg = document.getElementById('config-msg');
  const fd = new FormData();
  fd.append('site_name', siteName);
  fd.append('site_url', siteURL);
  fd.append('wxpay_qrcode', wxpay);
  fd.append('alipay_qrcode', alipay);

  fetch('/admin/config/save', {method:'POST', body:fd})
    .then(r => r.json())
    .then(d => {
      msg.style.color = d.code === 200 ? '#00e474' : '#ff4477';
      msg.textContent = d.msg;
      setTimeout(() => msg.textContent = '', 3000);
    });
}
function loadMerchant() {
  fetch('/admin/merchant')
    .then(r => r.json())
    .then(d => {
      if(d.code == 200) {
        document.getElementById('mch-pid').textContent = d.data.pid || '—';
        document.getElementById('mch-key').value = d.data.key || '';
      }
    });
}
function saveMerchantKey() {
  const key = document.getElementById('mch-key').value.trim();
  const msg = document.getElementById('mch-msg');
  const btn = document.getElementById('btn-save-key');
  if(!key) { msg.textContent='密钥不能为空'; return; }
  btn.disabled = true; btn.textContent = '保存中...';
  const fd = new FormData();
  fd.append('key', key);
  fetch('/admin/merchant/save', {method:'POST', body:fd})
    .then(r => r.json())
    .then(d => {
      msg.style.color = d.code == 200 ? '#00e474' : '#ff4477';
      msg.textContent = d.msg;
      btn.disabled = false; btn.textContent = '保存密钥';
      setTimeout(() => msg.textContent = '', 3000);
    });
}
function showConfig() {
  document.getElementById('cfgModal').style.display = 'flex';
  loadConfig();
  loadMerchant();
}
function closeConfigModal() {
  document.getElementById('cfgModal').style.display = 'none';
}

// 初始化
checkAuth();
document.addEventListener('keydown', e => e.key === 'Escape' && closeConfigModal());
</script>
</body>
</html>
