<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevPay 管理登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:#fff;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:360px;text-align:center}
.card h2{color:#333;margin-bottom:8px;font-size:22px}
.card p{color:#999;font-size:13px;margin-bottom:28px}
input{width:100%;padding:12px 16px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none;box-sizing:border-box}
input:focus{border-color:#667eea}
button{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:4px}
button:hover{opacity:.9}
.error{color:#e74c3c;font-size:13px;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h2>🔐 DevPay</h2>
  <p>支付平台管理后台</p>
  <input type="text" id="username" placeholder="用户名" autocomplete="off">
  <input type="password" id="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">登 录</button>
  <div class="error" id="errorMsg"></div>
</div>
<script>
function doLogin() {
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  var err = document.getElementById('errorMsg');
  if(!u || !p) { err.textContent = '请输入用户名和密码'; return; }
  err.textContent = '';
  var fd = new FormData();
  fd.append('username', u);
  fd.append('password', p);
  fetch('/admin/login', {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.code === 200) { location.href = '/admin/'; }
      else { err.textContent = d.msg || '登录失败'; }
    })
    .catch(function(){ err.textContent = '网络错误'; });
}
</script>
</body>
</html>
