<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevPay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#050818;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    overflow:hidden;
}
/* 动态粒子画布全屏 */
#particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* 赛博故障文字 */
@keyframes glitch {
    0%{text-shadow: 0.05em 0 0 rgba(255,0,80,0.75),-0.05em -0.025em 0 rgba(0,200,255,0.75);}
    14%{text-shadow: 0.05em 0 0 rgba(255,0,80,0.75),-0.05em -0.025em 0 rgba(0,200,255,0.75);}
    15%{text-shadow: -0.05em -0.025em 0 rgba(255,0,80,0.75),0.025em 0.025em 0 rgba(0,200,255,0.75);}
    49%{text-shadow: -0.05em -0.025em 0 rgba(255,0,80,0.75),0.025em 0.025em 0 rgba(0,200,255,0.75);}
    50%{text-shadow: 0.025em 0.05em 0 rgba(255,0,80,0.75),0.05em 0 0 rgba(0,200,255,0.75);}
    99%{text-shadow: 0.025em 0.05em 0 rgba(255,0,80,0.75),0.05em 0 0 rgba(0,200,255,0.75);}
    100%{text-shadow: -0.025em 0 0 rgba(255,0,200,0.75),-0.025em -0.025em 0 rgba(0,210,255,0.75);}
}

/* 登录卡片在粒子上层 */
.card{
    position:relative;
    z-index:10;
    background:rgba(10,15,35,0.9);
    padding:45px 40px;
    border-radius:12px;
    border:1px solid rgba(0,210,255,0.3);
    box-shadow: 
        0 0 30px rgba(0,180,255,0.3),
        0 0 60px rgba(180,0,255,0.2),
        inset 0 0 30px rgba(0,80,120,0.1);
    width:380px;
    text-align:center;
    backdrop-filter:blur(10px);
}
.card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    border-radius:12px;
    padding:1px;
    background:linear-gradient(45deg,#00d2ff,#a0f,#00d2ff);
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}
.card h2{
    color:#fff;
    margin-bottom:8px;
    font-size:26px;
    font-weight:bold;
    animation:glitch 2s infinite linear alternate-reverse;
}
.card p{
    color:#00d2ff;
    font-size:14px;
    margin-bottom:32px;
    letter-spacing:1px;
    text-transform:uppercase;
}
input{
    width:100%;
    padding:14px 18px;
    margin-bottom:16px;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(0,210,255,0.4);
    border-radius:6px;
    font-size:15px;
    outline:none;
    color:#fff;
    transition:0.3s;
}
input:focus{
    border-color:#ff00c8;
    box-shadow:0 0 15px rgba(255,0,200,0.3);
    background:rgba(0,0,0,0.5);
}
button{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#00d2ff,#a0f);
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
    transition:0.3s;
    box-shadow:0 0 15px rgba(160,0,255,0.4);
}
button:hover{
    opacity:0.9;
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(160,0,255,0.6);
}
.error{
    color:#ff4477;
    font-size:13px;
    margin-top:12px;
    min-height:18px;
    text-shadow:0 0 5px rgba(255,68,119,0.5);
}
</style>
</head>
<body>

<!-- 动态粒子背景画布 -->
<canvas id="particles"></canvas>

<!-- 登录卡片 -->
<div class="card">
  <h2>🔐 DEVPAY</h2>
  <p>支付后台</p>
  <input type="text" id="username" placeholder="用户名" autocomplete="off">
  <input type="password" id="password" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">登 录</button>
  <div class="error" id="errorMsg"></div>
</div>

<script>
// ===================== 动态赛博粒子背景 =====================
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

let particles = [];
const particleCount = 80;

class Particle{
    constructor(){
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.color = Math.random() > 0.5 ? '#00d2ff' : '#a0f';
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x < 0 || this.x > w) this.speedX *= -1;
        if(this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw(){
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init(){
    particles = [];
    for(let i=0;i<particleCount;i++) particles.push(new Particle());
}
init();

function connect(){
    for(let a=0;a<particles.length;a++){
        for(let b=a;b<particles.length;b++){
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 120){
                ctx.strokeStyle = `rgba(0,210,255,${1 - dist/120})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p => {p.update();p.draw();});
    connect();
    requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', ()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    init();
});

// ===================== 登录逻辑 =====================
function doLogin() {
  var u = document.getElementById('username').value;
  var p = document.getElementById('password').value;
  var err = document.getElementById('errorMsg');
  if(!u || !p) { err.textContent = '请输入用户名和密码'; return; }
  err.textContent = '';
  var fd = new FormData();
  fd.append('username', u);
  fd.append('password', p);
  fetch('/admin/login', {method:'POST', body:fd})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.code === 200) { location.href = '/admin/'; }
      else { err.textContent = d.msg || '登录失败'; }
    })
    .catch(function(){ err.textContent = '网络错误'; });
}
</script>
</body>
</html>
