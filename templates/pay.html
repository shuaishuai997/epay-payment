<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.SiteName}} - {{.PayType}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.15);overflow:hidden;max-width:420px;width:100%}
.header{padding:24px;text-align:center;color:#fff}
.header.wxpay{background:linear-gradient(135deg,#07c160,#06ad56)}
.header.alipay{background:linear-gradient(135deg,#1677ff,#0958d9)}
.header.qqpay{background:linear-gradient(135deg,#12b7f5,#0e9fe5)}
.icon{font-size:40px;margin-bottom:8px}
.header h2{font-size:18px;font-weight:500}
.body{padding:30px 24px}
.order-info{margin-bottom:24px;text-align:center}
.order-info .name{font-size:14px;color:#999;margin-bottom:8px}
.order-info .amount{font-size:36px;font-weight:700;color:#333}
.order-info .amount span{font-size:18px}
.qrcode-box{text-align:center;margin-bottom:24px;padding:20px;background:#f8f9fa;border-radius:12px}
.qrcode-box .hint{font-size:13px;color:#999;margin-top:12px}
.status-bar{text-align:center;padding:12px;border-radius:8px;font-size:14px}
.status-bar.waiting{background:#fff8e1;color:#f57c00}
.status-bar.paid{background:#e8f5e9;color:#2e7d32}
.countdown{font-size:13px;color:#999;text-align:center;margin-top:16px}
.footer{text-align:center;padding:16px;font-size:12px;color:#bbb}
</style>
</head>
<body>
<div class="card">
  <div class="header {{.PayType}}">
    <div class="icon">{{.PayTypeIcon}}</div>
    <h2>{{.PayType}}</h2>
  </div>
  <div class="body">
    <div class="order-info">
      <div class="name">{{.OrderName}}</div>
      <div class="amount"><span>¥</span>{{.Money}}</div>
    </div>
    <div class="qrcode-box">
      {{if .QRError}}
      <div style="width:200px;height:200px;margin:0 auto;background:#fff3cd;border:2px dashed #ffc107;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#856404;font-size:14px;text-align:center;padding:16px;box-sizing:border-box">⚠ {{.QRError}}</div>
      {{else if .QRBase64}}
      <img src="data:image/png;base64,{{.QRBase64}}" width="200" height="200" style="border-radius:8px">
      {{end}}
      <div class="hint">{{if .QRError}}{{else}}请使用{{.PayType}}扫码完成支付{{end}}</div>
    </div>
    <div id="statusBar" class="status-bar waiting">⏳ 等待支付中...</div>
    <div class="countdown">订单将在 <span id="timer">15:00</span> 后过期</div>
  </div>
  <div class="footer">{{.SiteName}} · 安全支付</div>
</div>


<script>

var tradeNo = "{{.TradeNo}}";
var checkInterval = setInterval(function(){
  fetch("/pay/check?trade_no=" + tradeNo)
    .then(function(r){return r.json()})
    .then(function(data){
      if(data.data && data.data.status === 1){
        clearInterval(checkInterval);
        var bar = document.getElementById("statusBar");
        bar.className = "status-bar paid";
        bar.innerHTML = "✅ 支付成功！正在跳转...";
        setTimeout(function(){
          var returnUrl = data.data.return_url;
          if(returnUrl){
            window.location.href = returnUrl;
          } else {
            bar.innerHTML = "✅ 支付成功！";
          }
        }, 1500);
      }
    }).catch(function(){});
}, 3000);

var totalSeconds = 900;
function updateTimer(){
  if(totalSeconds <= 0) return;
  totalSeconds--;
  var m = Math.floor(totalSeconds / 60);
  var s = totalSeconds % 60;
  document.getElementById("timer").textContent = (m<10?"0"+m:m)+":"+(s<10?"0"+s:s);
  if(totalSeconds <= 0){
    clearInterval(checkInterval);
    document.getElementById("statusBar").innerHTML = "⏰ 订单已过期";
  }
}
setInterval(updateTimer, 1000);
</script>
</body>
</html>
