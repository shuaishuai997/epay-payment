<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.SiteName}} - {{.PayType}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#050818;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
    overflow-x:hidden;
    position:relative;
}
/* 全屏动态粒子背景 */
#particles{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* 霓虹故障动画 */
@keyframes glitch{
    0%{text-shadow:0.05em 0 0 rgba(0,210,255,0.7),-0.05em -0.025em 0 rgba(255,0,200,0.7)}
    50%{text-shadow:-0.05em -0.025em 0 rgba(0,210,255,0.7),0.025em 0.025em 0 rgba(255,0,200,0.7)}
    100%{text-shadow:0.025em 0.05em 0 rgba(0,210,255,0.7),0.05em 0 0 rgba(255,0,200,0.7)}
}

/* 扫描线动画 */
@keyframes scan{
    0%{transform:translateY(-100%)}
    100%{transform:translateY(200%)}
}

.card{
    position:relative;
    z-index:10;
    background:rgba(10,15,35,0.92);
    border-radius:16px;
    border:1px solid rgba(0,210,255,0.3);
    box-shadow:
        0 0 40px rgba(0,180,255,0.25),
        0 0 80px rgba(180,0,255,0.15),
        inset 0 0 40px rgba(0,80,120,0.1);
    overflow:hidden;
    max-width:420px;
    width:100%;
    backdrop-filter:blur(10px);
}
.card::after{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:6px;
    background:linear-gradient(90deg,#00d2ff,#ff00c8);
    animation:scan 4s linear infinite;
    opacity:0.6;
}

.header{
    padding:28px 24px;
    text-align:center;
    background:rgba(0,0,0,0.4);
    border-bottom:1px solid rgba(0,210,255,0.2);
}
.icon{font-size:44px;margin-bottom:10px}
.header h2{
    font-size:20px;
    font-weight:600;
    animation:glitch 3s infinite alternate-reverse;
}

.body{padding:32px 28px}
.order-info{margin-bottom:28px;text-align:center}
.order-info .name{
    font-size:14px;
    color:#00d2ff;
    margin-bottom:10px;
    letter-spacing:1px;
}
.order-info .amount{
    font-size:42px;
    font-weight:700;
    color:#fff;
    text-shadow:0 0 15px rgba(0,210,255,0.5);
}
.order-info .amount span{
    font-size:20px;
    margin-right:4px;
    color:#ff00c8;
}

.qrcode-box{
    text-align:center;
    margin-bottom:28px;
    padding:24px;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(0,210,255,0.25);
    border-radius:14px;
}
.qrcode-box .hint{
    font-size:13px;
    color:#aaa;
    margin-top:14px;
}
.qrcode-box img{
    border-radius:10px;
    border:2px solid rgba(0,210,255,0.3);
    box-shadow:0 0 20px rgba(0,210,255,0.2);
}

.status-bar{
    text-align:center;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:500;
    border:1px solid transparent;
}
.status-bar.waiting{
    background:rgba(255,193,7,0.1);
    color:#ffcc00;
    border-color:rgba(255,193,7,0.3);
}
.status-bar.paid{
    background:rgba(46,125,50,0.15);
    color:#00e474;
    border-color:rgba(46,125,50,0.4);
}

.countdown{
    font-size:13px;
    color:#888;
    text-align:center;
    margin-top:18px;
}
#timer{
    color:#ff00c8;
    font-weight:bold;
    text-shadow:0 0 6px #ff00c8;
}

.footer{
    text-align:center;
    padding:20px;
    font-size:12px;
    color:#666;
    border-top:1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body>
<!-- 动态粒子背景（和登录页完全一样） -->
<canvas id="particles"></canvas>

<div class="card">
    <div class="header">
        <div class="icon">{{.PayTypeIcon}}</div>
        <h2>{{.PayType}}</h2>
    </div>

    <div class="body">
        <div class="order-info">
            <div class="name">{{.OrderName}}</div>
            <div class="amount"><span>¥</span>{{.Money}}</div>
        </div>

        <div class="qrcode-box">
            {{if .QRError}}
            <div style="width:200px;height:200px;margin:0 auto;background:rgba(255,152,0,0.1);border:2px dashed #ff9800;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#ffca28;font-size:14px;text-align:center;padding:16px;">
                ⚠ {{.QRError}}
            </div>
            {{else if .QRBase64}}
            <img src="data:image/png;base64,{{.QRBase64}}" width="200" height="200">
            {{end}}
            <div class="hint">{{if .QRError}}{{else}}请使用{{.PayType}}扫码完成支付{{end}}</div>
        </div>

        <div id="statusBar" class="status-bar waiting">⏳ 等待支付中...</div>
        <div class="countdown">订单将在 <span id="timer">15:00</span> 后过期</div>
    </div>

    <div class="footer">{{.SiteName}} · 安全支付</div>
</div>

<script>
// ===================== 动态赛博粒子背景 =====================
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

let particles = [];
const particleCount = 80;

class Particle{
    constructor(){
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.color = Math.random() > 0.5 ? '#00d2ff' : '#a0f';
    }
    update(){
        this.x += this.speedX;
        this.y += this.speedY;
        if(this.x < 0 || this.x > w) this.speedX *= -1;
        if(this.y < 0 || this.y > h) this.speedY *= -1;
    }
    draw(){
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init(){
    particles = [];
    for(let i=0;i<particleCount;i++) particles.push(new Particle());
}
init();

function connect(){
    for(let a=0;a<particles.length;a++){
        for(let b=a;b<particles.length;b++){
            const dx = particles[a].x - particles[b].x;
            const dy = particles[a].y - particles[b].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 120){
                ctx.strokeStyle = `rgba(0,210,255,${1 - dist/120})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(particles[a].x, particles[a].y);
                ctx.lineTo(particles[b].x, particles[b].y);
                ctx.stroke();
            }
        }
    }
}

function animate(){
    ctx.clearRect(0,0,w,h);
    particles.forEach(p => {p.update();p.draw();});
    connect();
    requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', ()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    init();
});

// ===================== 支付状态轮询 =====================
const tradeNo = "{{.TradeNo}}";
const checkInterval = setInterval(() => {
    fetch(`/pay/check?trade_no=${tradeNo}`)
        .then(res => res.json())
        .then(data => {
            if (data.data?.status === 1) {
                clearInterval(checkInterval);
                const bar = document.getElementById("statusBar");
                bar.className = "status-bar paid";
                bar.innerHTML = "✅ 支付成功！正在跳转...";
                
                setTimeout(() => {
                    data.data.return_url
                        ? (window.location.href = data.data.return_url)
                        : (bar.innerHTML = "✅ 支付成功！");
                }, 1500);
            }
        })
        .catch(() => {});
}, 3000);

// ===================== 倒计时 =====================
let totalSeconds = 900;
const timerEl = document.getElementById("timer");
const statusEl = document.getElementById("statusBar");

function updateTimer() {
    if (totalSeconds <= 0) {
        clearInterval(checkInterval);
        statusEl.innerHTML = "⏰ 订单已过期";
        timerEl.textContent = "00:00";
        return;
    }
    totalSeconds--;
    const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
}
setInterval(updateTimer, 1000);
</script>
</body>
</html>
